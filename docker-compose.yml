services:
  nymead:
    build: .
    image: nymea-local:trixie
    network_mode: host
    uts: host
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      TZ: ${TZ:-Europe/Vienna}
      NYMEAD_EXTRA_ARGS: ${NYMEAD_EXTRA_ARGS:-}
    volumes:
      - ${NYMEA_DATA_DIR:-./data}/nymea:/var/lib/nymea
      - ${NYMEA_DATA_DIR:-./data}/cache:/var/cache/nymea
      - ${NYMEA_DATA_DIR:-./data}/backups:/var/backups
    tmpfs:
      - /run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
