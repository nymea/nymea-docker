[server]
enable-dbus=yes
use-ipv4=yes
use-ipv6=yes
# Cooperate with a host mDNS responder, when present.
disallow-other-stacks=no

[wide-area]
enable-wide-area=no

[publish]
# Host UTS + host networking make these the host's name and LAN addresses.
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no

[reflector]
enable-reflector=no
